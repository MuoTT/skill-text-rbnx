# Codegen mirror of the upstream plotter primitive contract.
#
# This skill CONSUMES robonix/primitive/plotter/trajectory over gRPC but
# does not provide it. Keeping this mirror lets `rbnx codegen` emit the
# generated request/response classes and gRPC stub in this package's
# rbnx-build/codegen directory. It is intentionally NOT listed in
# package_manifest.yaml capabilities.
[contract]
id      = "robonix/primitive/plotter/trajectory"
version = "1"
kind    = "primitive"
idl     = "plotter/srv/Trajectory.srv"

[mode]
type = "rpc"